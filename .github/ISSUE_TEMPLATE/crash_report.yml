name: Crash Report
description: Report an unhandled exception or server crash in AmberPM
title: "[Crash]: "
labels: ["status: unconfirmed", "type: bug", "crash"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide the full crashdump file or stack trace generated by AmberPM.

  - type: input
    id: version
    attributes:
      label: AmberPM Version
      description: Provide the exact AmberPM version and git commit.
      placeholder: "AmberPM 5.44.2+dev [Protocol 2169] (git: 7ba8a2f...)"
    validations:
      required: true

  - type: input
    id: php_version
    attributes:
      label: PHP Version & OS
      description: Output of `php -v` and your host OS.
      placeholder: "PHP 8.2.30 (Linux x86_64)"
    validations:
      required: true

  - type: textarea
    id: crashdump
    attributes:
      label: Crashdump / Full Stack Trace
      description: Paste the complete contents of the crashdump file or console exception trace.
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context / What was happening when the crash occurred?
      description: What actions were players or plugins performing right before the crash?
      placeholder: "A player connected with version 1.26.44 and opened their inventory..."
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that this crash has not already been reported.
          required: true
        - label: I provided the complete, unedited crashdump or stack trace.
          required: true

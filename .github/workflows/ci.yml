name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Amber
        uses: actions/checkout@v6

      - name: Setup PocketMine PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.3'
          install-path: ./bin
          pm-version-major: 5

      - name: Verify PocketMine PHP extensions
        run: |
          php -r 'foreach ( ["pmmpthread", "encoding", "crypto", "libdeflate", "morton", "chunkutils2", "leveldb", "gmp", "igbinary", "sockets", "curl", "yaml", "mbstring", "simplexml", "zip"] as $extension ) { if ( ! extension_loaded( $extension ) ) { fwrite( STDERR, "Missing PHP extension: $extension\n" ); exit( 1 ); } } if ( ! PHP_ZTS ) { fwrite( STDERR, "PHP must be built with ZTS enabled\n" ); exit( 1 ); }'

      - name: Validate Composer configuration and lock
        run: composer validate --no-interaction

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-8.3-

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP syntax
        shell: bash
        run: find src generated -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -n -l

      - name: Run PHPUnit suite
        run: |
          if [ -d tests/phpunit ]; then
            vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit
          else
            echo "No PHPUnit tests found; skipping suite"
          fi

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Regenerate and verify generated code
        run: |
          composer update-codegen
          git diff --exit-code -- src generated
          test -z "$(git ls-files --others --exclude-standard -- src generated)"

  php-compatibility:
    name: PHP ${{ matrix.php }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout Amber
        uses: actions/checkout@v6

      - name: Setup PocketMine PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: ${{ matrix.php }}
          install-path: ./bin
          pm-version-major: 5

      - name: Verify PocketMine PHP extensions
        run: |
          php -r 'foreach ( ["pmmpthread", "encoding", "crypto", "libdeflate", "morton", "chunkutils2", "leveldb", "gmp", "igbinary", "sockets", "curl", "yaml", "mbstring", "simplexml", "zip"] as $extension ) { if ( ! extension_loaded( $extension ) ) { fwrite( STDERR, "Missing PHP extension: $extension\n" ); exit( 1 ); } } if ( ! PHP_ZTS ) { fwrite( STDERR, "PHP must be built with ZTS enabled\n" ); exit( 1 ); }'

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify source and generated PHP syntax
        shell: bash
        run: find src generated -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -n -l

      - name: Verify Composer autoload
        run: php -r 'require "vendor/autoload.php";'

      - name: Run PHPUnit suite
        run: |
          if [ -d tests/phpunit ]; then
            vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit
          else
            echo "No PHPUnit tests found; skipping suite"
          fi

  build:
    name: Build PHAR (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Amber
        uses: actions/checkout@v6

      - name: Setup PocketMine PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.3'
          install-path: ./bin
          pm-version-major: 5

      - name: Verify PocketMine PHP extensions
        run: |
          php -r 'foreach ( ["pmmpthread", "encoding", "crypto", "libdeflate", "morton", "chunkutils2", "leveldb", "gmp", "igbinary", "sockets", "curl", "yaml", "mbstring", "simplexml", "zip"] as $extension ) { if ( ! extension_loaded( $extension ) ) { fwrite( STDERR, "Missing PHP extension: $extension\n" ); exit( 1 ); } } if ( ! PHP_ZTS ) { fwrite( STDERR, "PHP must be built with ZTS enabled\n" ); exit( 1 ); }'

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-8.3-

      - name: Build production PHAR
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: composer make-server

      - name: Verify PHAR artifact
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          test -s PocketMine-MP.phar
          php build/verify-phar.php --phar=PocketMine-MP.phar

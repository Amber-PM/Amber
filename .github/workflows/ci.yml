name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_candidate_tag:
        description: 'Build an untagged release candidate (e.g. v1.6.0); does not publish'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (PHP 8.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Amber
        uses: actions/checkout@v6

      - name: Setup PocketMine PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.3'
          install-path: ./bin
          pm-version-major: 5

      - name: Build pinned NetherNet native backend for this PHP ZTS ABI
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bison re2c cmake g++ libssl-dev
          bash build/install-webrtc.sh

      - name: Verify PocketMine PHP extensions
        run: |
          php -r 'foreach ( ["webrtc", "pmmpthread", "encoding", "crypto", "libdeflate", "morton", "chunkutils2", "leveldb", "gmp", "igbinary", "sockets", "curl", "yaml", "mbstring", "simplexml", "zip"] as $extension ) { if ( ! extension_loaded( $extension ) ) { fwrite( STDERR, "Missing PHP extension: $extension\n" ); exit( 1 ); } } if ( ! PHP_ZTS ) { fwrite( STDERR, "PHP must be built with ZTS enabled\n" ); exit( 1 ); }'

      - name: Validate Composer configuration and lock
        run: composer validate --no-interaction

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-8.3-

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify installed NetherNet native API
        run: php -r 'require "vendor/autoload.php"; \amber\nethernet\backend\ExtWebRtcPeer::assertAvailable();'

      - name: Run complete NetherNet native suite (locked fixtures, real backend)
        run: composer test:nethernet-native

      - name: Stage and verify relocatable Linux x86_64 PHP runtime
        run: |
          sudo apt-get install -y patchelf
          php_prefix=$(dirname "$(dirname "$(readlink -f "$(command -v php)")")")
          bash build/package-linux-runtime.sh "$php_prefix" .native-webrtc "$RUNNER_TEMP/amber-runtime-artifacts"
          mkdir -p "$RUNNER_TEMP/amber-runtime-moved"
          tar -xzf "$RUNNER_TEMP/amber-runtime-artifacts/amber-php-linux-x86_64-staging.tar.gz" -C "$RUNNER_TEMP/amber-runtime-moved"
          env -u PHPRC -u LD_LIBRARY_PATH -u PHP_INI_SCAN_DIR "$RUNNER_TEMP/amber-runtime-moved/bin/php7/bin/php" vendor/bin/phpunit --configuration vendor/amber-pm/nethernet/phpunit.native.xml.dist --bootstrap tests/phpunit/nethernet-native-bootstrap.php --fail-on-skipped --do-not-cache-result

      - name: Save Linux runtime candidate for release review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: amber-php-linux-x86_64-staging
          path: ${{ runner.temp }}/amber-runtime-artifacts/*
          if-no-files-found: error

      - name: Check PHP syntax
        shell: bash
        run: find src generated -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -n -l

      - name: Run PHPUnit suite
        run: |
          if [ -d tests/phpunit ]; then
            vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit
          else
            echo "No PHPUnit tests found; skipping suite"
          fi

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Regenerate and verify generated code
        run: |
          composer update-codegen
          git diff --exit-code -- src generated
          test -z "$(git ls-files --others --exclude-standard -- src generated)"

  php-compatibility:
    name: PHP ${{ matrix.php }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout Amber
        uses: actions/checkout@v6

      - name: Setup PocketMine PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: ${{ matrix.php }}
          install-path: ./bin
          pm-version-major: 5

      - name: Build pinned NetherNet native backend for this PHP ZTS ABI
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bison re2c cmake g++ libssl-dev
          bash build/install-webrtc.sh

      - name: Verify PocketMine PHP extensions
        run: |
          php -r 'foreach ( ["webrtc", "pmmpthread", "encoding", "crypto", "libdeflate", "morton", "chunkutils2", "leveldb", "gmp", "igbinary", "sockets", "curl", "yaml", "mbstring", "simplexml", "zip"] as $extension ) { if ( ! extension_loaded( $extension ) ) { fwrite( STDERR, "Missing PHP extension: $extension\n" ); exit( 1 ); } } if ( ! PHP_ZTS ) { fwrite( STDERR, "PHP must be built with ZTS enabled\n" ); exit( 1 ); }'

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify installed NetherNet native API
        run: php -r 'require "vendor/autoload.php"; \amber\nethernet\backend\ExtWebRtcPeer::assertAvailable();'

      - name: Run complete NetherNet native suite (locked fixtures, real backend)
        run: composer test:nethernet-native

      - name: Verify source and generated PHP syntax
        shell: bash
        run: find src generated -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -n -l

      - name: Verify Composer autoload
        run: php -r 'require "vendor/autoload.php";'

      - name: Run PHPUnit suite
        run: |
          if [ -d tests/phpunit ]; then
            vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit
          else
            echo "No PHPUnit tests found; skipping suite"
          fi

  build:
    name: Build PHAR (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Amber
        uses: actions/checkout@v6

      - name: Setup PocketMine PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.3'
          install-path: ./bin
          pm-version-major: 5

      - name: Build pinned NetherNet native backend for this PHP ZTS ABI
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bison re2c cmake g++ libssl-dev
          bash build/install-webrtc.sh

      - name: Verify PocketMine PHP extensions
        run: |
          php -r 'foreach ( ["webrtc", "pmmpthread", "encoding", "crypto", "libdeflate", "morton", "chunkutils2", "leveldb", "gmp", "igbinary", "sockets", "curl", "yaml", "mbstring", "simplexml", "zip"] as $extension ) { if ( ! extension_loaded( $extension ) ) { fwrite( STDERR, "Missing PHP extension: $extension\n" ); exit( 1 ); } } if ( ! PHP_ZTS ) { fwrite( STDERR, "PHP must be built with ZTS enabled\n" ); exit( 1 ); }'

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-8.3-

      - name: Build PHAR
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          CANDIDATE_TAG: ${{ inputs.release_candidate_tag || '' }}
        run: |
          if [[ -n "$CANDIDATE_TAG" ]]; then
            composer install --no-dev --classmap-authoritative --ignore-platform-reqs --no-interaction --no-progress
            php -dphar.readonly=0 build/server-phar.php --tag="$CANDIDATE_TAG"
          else
            composer make-server
          fi

      - name: Verify PHAR artifact
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          CANDIDATE_TAG: ${{ inputs.release_candidate_tag || '' }}
        run: |
          test -s PocketMine-MP.phar
          if [[ -n "$CANDIDATE_TAG" ]]; then
            php build/verify-phar.php --phar=PocketMine-MP.phar --tag="$CANDIDATE_TAG"
          else
            php build/verify-phar.php --phar=PocketMine-MP.phar
          fi
          php -r '$phar = new Phar("PocketMine-MP.phar"); $phar->getStub(); require "phar://PocketMine-MP.phar/vendor/autoload.php"; if(!class_exists(\amber\nethernet\Transport::class) || !interface_exists(\amber\nethernet\SignalingPeerConnection::class)){exit(1);} \amber\nethernet\backend\ExtWebRtcPeer::assertAvailable();'

      - name: Smoke test release candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate_tag != '' }}
        run: php tests/support/check-server-startup.php "$PWD/PocketMine-MP.phar" "$RUNNER_TEMP/amber-rc-smoke" false false

      - name: Upload verified release candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate_tag != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: amber-rc-${{ inputs.release_candidate_tag }}-${{ github.sha }}
          path: PocketMine-MP.phar
          if-no-files-found: error
          retention-days: 14
